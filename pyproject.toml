[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ukbbs-workflow"
version = "0.1.0"
description = "Reproducible UK BBS download and preprocessing workflow"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5", "pandas==2.2.3", "pyproj==3.7.2"]

[project.optional-dependencies]
notebook = ["jupyterlab>=4.2,<5", "ipykernel==6.30.1"]

[tool.setuptools.packages.find]
where = ["src"]
